name: t03-unique-50-pass
# 50 distinct reusable workflows from one caller. EXPECT: success.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually run leaf jobs (costs minutes). Limit validation happens either way."
        type: boolean
