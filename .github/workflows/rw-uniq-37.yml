name: rw-uniq-37
# Leaf reusable workflow #37 for the 50-unique-reference tests.
# The job is skipped unless execute=true, so the limit can be tested for free.
on:
  workflow_call:
    inputs:
      execute:
        type: boolean
        default: false

jobs:
  leaf:
    if: ${{ inputs.execute }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "rw-uniq-37 executed"
