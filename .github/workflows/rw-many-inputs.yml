jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - env:
          ALL_INPUTS: ${{ toJSON(inputs) }}
        run: |
          n=$(echo "$ALL_INPUTS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for v in d.values() if v))')
          echo "Non-empty inputs received: $n (expected 100)"
          [ "$n" = "100" ] || { echo "::error::Not all inputs arrived"; exit 1; }
